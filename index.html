<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Household Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* navy + yellow. Variable names kept from the first draft: "teal" = navy roles, "carmine" = yellow/attention roles */
  --teal:#2B4C80; --teal-dark:#1D3461; --teal-deep:#0F1F3D; --teal-light:#C8D3E8; --teal-surface:#EDF1F8;
  --carmine:#F2B705; --carmine-dark:#7A5300; --carmine-light:#FFF3C4; --green:#1D3461;
  --yellow:#F2B705; --yellow-hover:#E0A800;
  --bg-1:#f4f5f7; --bg-2:#eef0f3; --card:#fff; --border:#e6e8ec; --grey-light:#C9CDD3;
  --text:#14182B; --muted:#6B7280;
  --shadow:0 1px 3px rgba(15,31,61,.08); --shadow-md:0 3px 12px rgba(15,31,61,.14);
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{font-family:"Open Sans","Segoe UI",Arial,sans-serif;background:var(--bg-1);color:var(--text);padding-bottom:84px;-webkit-text-size-adjust:100%;}
h1,h2,h3{font-weight:300;letter-spacing:-.015em;margin:0;}
.wrap{max-width:860px;margin:0 auto;padding:0 16px;}
header.top{background:var(--card);position:sticky;top:0;z-index:20;}
.top-inner{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;}
.top h1{font-size:22px;}
.top .sub{font-size:12px;color:var(--muted);}
.hairline{height:2px;border:0;margin:0;background:linear-gradient(90deg,var(--teal-deep) 0%,var(--teal-deep) 70%,var(--yellow) 70%);}
main{padding-top:16px;}
.eyebrow{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--teal-dark);margin:0 0 10px;}
.section{margin-bottom:22px;}
.card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);padding:16px;min-width:0;overflow:hidden;}
.card+.card{margin-top:12px;}
.grid-2>.card+.card{margin-top:0;}
.pill{display:inline-flex;background:var(--bg-2);border-radius:20px;padding:3px;gap:2px;}
.pill button{border:0;background:none;font-family:inherit;font-size:12px;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:16px;cursor:pointer;min-height:32px;}
.pill button.on{background:var(--teal-deep);color:#fff;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
@media(max-width:620px){.grid-2{grid-template-columns:1fr;}}
.muted{color:var(--muted);} .small{font-size:12px;}
.num{white-space:nowrap;font-variant-numeric:tabular-nums;}
.hidden{display:none !important;}
.status{position:fixed;left:50%;bottom:calc(72px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:50;max-width:calc(100% - 32px);width:max-content;
  background:var(--teal-deep);color:#fff;font-size:13px;font-weight:600;line-height:1.35;padding:10px 16px;border-radius:999px;box-shadow:0 6px 20px rgba(15,31,61,.25);
  opacity:0;pointer-events:none;transition:opacity .25s ease,transform .25s ease;text-align:center;}
.status.show{opacity:1;transform:translate(-50%,0);}
.status.err{background:var(--yellow);color:var(--teal-deep);pointer-events:auto;cursor:pointer;}
.status.err{color:var(--carmine-dark);font-weight:600;}
nav.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--border);z-index:30;padding-bottom:env(safe-area-inset-bottom);}
nav.bottom .inner{max-width:860px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);}
nav.bottom button{position:relative;background:none;border:0;font-family:inherit;font-size:11px;font-weight:600;color:var(--muted);padding:9px 0 11px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
nav.bottom svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;}
nav.bottom button.active{color:var(--teal-deep);}
nav.bottom button.active svg{stroke:var(--teal-deep);}
nav.bottom button.active::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--yellow);}
.dot{position:absolute;top:6px;left:calc(50% + 8px);min-width:16px;height:16px;border-radius:8px;background:var(--yellow);color:var(--teal-deep);font-weight:700;font-size:10px;line-height:16px;padding:0 4px;}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-dark);min-width:0;}
input,select{font-family:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--grey-light);background:#fff;color:var(--text);min-height:44px;width:100%;}
input:focus,select:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:var(--teal);}
input[type=checkbox]{width:20px;min-height:20px;height:20px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.form-grid .full{grid-column:1/-1;}
@media(max-width:420px){.form-grid{grid-template-columns:1fr;}}
.seg{display:flex;border:1px solid var(--grey-light);border-radius:10px;overflow:hidden;background:#fff;}
.seg button{flex:1;border:0;background:#fff;font-family:inherit;font-size:13px;font-weight:600;color:var(--muted);padding:9px 4px;min-height:42px;cursor:pointer;}
.seg button+button{border-left:1px solid var(--grey-light);}
.seg button.on{background:var(--teal-dark);color:#fff;}
.btn{font-family:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:10px 16px;min-height:44px;cursor:pointer;background:var(--teal-dark);color:#fff;}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.btn.ghost{background:var(--bg-2);color:var(--text);}
.btn.warn{background:var(--carmine-light);color:var(--carmine-dark);}
.btn.accent{background:var(--yellow);color:var(--teal-deep);}
.btn.accent:hover{background:var(--yellow-hover);}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13px;}
.btn.on{outline:2px solid var(--teal-dark);}
.row-btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
.actions-row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:12px;}
.pot .name{font-size:13px;font-weight:600;}
.pot .amt{display:flex;justify-content:space-between;align-items:baseline;margin:8px 0;gap:8px;}
.pot .spent{font-size:clamp(20px,5vw,26px);font-weight:300;white-space:nowrap;}
.pot .of{font-size:12px;color:var(--muted);white-space:nowrap;}
.track{height:8px;background:var(--bg-2);border-radius:4px;overflow:hidden;}
.fill{height:100%;background:var(--teal-dark);border-radius:4px;} .fill.over{background:var(--yellow);}
.pot .rem{font-size:12px;margin-top:6px;color:var(--muted);} .pot .rem.neg{color:var(--carmine-dark);font-weight:600;}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:var(--teal-surface);color:var(--teal-dark);white-space:nowrap;}
.chip.warn{background:var(--carmine-light);color:var(--carmine-dark);}
.chip.grey{background:var(--bg-2);color:var(--muted);}
.chip.ok{background:var(--teal-surface);color:var(--teal-deep);}
.filters{position:sticky;top:58px;z-index:10;background:var(--bg-1);padding:6px 0 10px;}
.filter-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;}
.filter-scroll::-webkit-scrollbar{display:none;}
.filter-scroll select{width:auto;flex:0 0 auto;font-size:14px;padding:7px 8px;min-height:36px;border-radius:20px;}
.filter-scroll select.set{border-color:var(--teal-dark);background:var(--teal-surface);color:var(--teal-deep);font-weight:600;}
.summary{font-size:12px;color:var(--muted);margin-top:8px;display:flex;justify-content:space-between;gap:8px;}
.day{margin-top:14px;}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);padding:0 4px 6px;text-transform:uppercase;letter-spacing:.04em;}
.rows{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;}
.row{padding:12px 14px;cursor:pointer;}
.row+.row{border-top:1px solid var(--border);}
.row-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;min-width:0;}
.row-title{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.row-amt{font-weight:600;font-size:15px;white-space:nowrap;flex-shrink:0;}
.row-amt.in{color:var(--teal-dark);} .row-amt.tr{color:var(--muted);}
.row-meta{display:flex;gap:6px 8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted);margin-top:4px;}
.row-detail{margin-top:10px;font-size:13px;color:var(--muted);display:none;cursor:default;}
.row.open .row-detail{display:block;}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;} .kv b{font-weight:600;color:var(--text);}
.li{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0;}
.li+.li{border-top:1px solid var(--border);}
.li .t{font-weight:600;font-size:14px;} .li .d{font-size:12px;color:var(--muted);margin-top:3px;}
.li .r{text-align:right;flex-shrink:0;}
.acc-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px;}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:14px;}
.note{font-size:13px;color:var(--muted);line-height:1.55;}
.kpi{font-size:clamp(22px,6vw,30px);font-weight:300;white-space:nowrap;}
.sheet{border:1px solid var(--teal-light);background:var(--teal-surface);border-radius:12px;padding:12px;margin-top:10px;cursor:default;}
.sheet .form-grid{gap:10px;}
.progress{display:flex;gap:4px;margin:4px 0 14px;}
.progress span{flex:1;height:6px;border-radius:3px;background:var(--bg-2);}
.progress span.done{background:var(--teal);}
.progress span.bad{background:var(--yellow);}
.me-step{margin-bottom:18px;}
.me-step h3{font-size:18px;margin-bottom:4px;}
.gap{display:flex;justify-content:space-between;padding:10px 12px;border-radius:10px;font-weight:600;margin-top:10px;}
.gap.ok{background:var(--teal-surface);color:var(--teal-deep);} .gap.bad{background:var(--carmine-light);color:var(--carmine-dark);border-left:4px solid var(--yellow);}
.inline-in{display:flex;gap:8px;align-items:center;}
.inline-in input{max-width:140px;}
.calc{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:13px;margin-top:8px;}
details.fold{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;}
details.fold>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:52px;}
details.fold>summary::-webkit-details-marker{display:none;}
details.fold>summary .st{display:flex;gap:8px;align-items:center;flex-shrink:0;}
details.fold>summary .st::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 4px;transition:transform .15s;}
details.fold[open]>summary .st::after{transform:rotate(-135deg);margin-bottom:-2px;}
details.fold>summary .ttl{font-size:16px;font-weight:600;min-width:0;}
details.fold>summary .ttl small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:2px;}
details.fold>.fb{padding:0 16px 14px;}
details.fold.inner{box-shadow:none;border:1px solid var(--border);border-radius:12px;margin:8px 0;}
details.fold.inner>summary{padding:10px 12px;min-height:44px;}
details.fold.inner>summary .ttl{font-size:14px;}
details.fold.inner>.fb{padding:0 12px 10px;}
.calc .tot{font-weight:700;border-top:1px solid var(--border);padding-top:4px;}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <div><h1 id="pageTitle">Home</h1><div class="sub" id="pageSub"></div></div>
  </div>
  <hr class="hairline">
</header>

<main class="wrap">
  <div id="status" class="status" aria-live="polite"></div>
  <section id="v-home"></section>
  <section id="v-log" class="hidden">
    <div class="card">
      <div class="eyebrow" id="logLabel">Log a transaction</div>
      <div class="seg" id="typeSeg" style="margin-bottom:14px;">
        <button type="button" data-t="spend" class="on">Spend</button>
        <button type="button" data-t="refund">Refund</button>
        <button type="button" data-t="income">Income</button>
        <button type="button" data-t="transfer">Transfer</button>
      </div>
      <form id="logForm" class="form-grid">
        <label class="f">Date<input type="date" id="fDate" required></label>
        <label class="f">Amount (£)<input type="number" id="fValue" min="0.01" step="0.01" inputmode="decimal" placeholder="0.00" required></label>
        <label class="f g-spend">Budget<select id="fPot"></select></label>
        <label class="f g-spend">Category<select id="fCategory"></select></label>
        <label class="f"><span id="accLabel">Account</span><select id="fAccount"></select></label>
        <label class="f g-transfer hidden">To account<select id="fTo"></select></label>
        <label class="f g-spend">Paid by<select id="fPaidBy"></select></label>
        <label class="f g-income hidden" style="flex-direction:row;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:14px;color:var(--text);font-weight:400;"><input type="checkbox" id="fBonus"> Bonus (tops up Exceptionals)</label>
        <label class="f full"><span id="retLabel">Retailer</span><input type="text" id="fRetailer" list="retailerList" autocomplete="off" required placeholder="e.g. Tesco"><datalist id="retailerList"></datalist></label>
        <div class="full actions-row" style="margin-top:0;">
          <button type="button" class="btn ghost hidden" id="cancelEdit">Cancel edit</button>
          <button type="submit" class="btn" id="submitBtn">Add</button>
        </div>
      </form>
      <div class="note small" id="typeHelp" style="margin-top:10px;"></div>
    </div>
    <div class="section" style="margin-top:20px;"><div class="eyebrow">Logged today</div><div id="todayList"></div></div>
  </section>
  <section id="v-feed" class="hidden">
    <div class="filters">
      <div class="filter-scroll">
        <select id="flPeriod"></select><select id="flPot"></select><select id="flAccount"></select><select id="flCategory"></select><select id="flPaidBy"></select><select id="flDir"></select><select id="flType"></select>
      </div>
      <div class="hidden" id="customRange" style="display:flex;gap:8px;margin-top:8px;"><input type="date" id="flFrom"><input type="date" id="flToDate"></div>
      <input type="search" id="flSearch" placeholder="Search retailer" style="margin-top:8px;">
      <div class="summary"><span id="feedCount"></span><span id="feedTotal" class="num"></span></div>
    </div>
    <div id="feed"></div>
  </section>
  <section id="v-plan" class="hidden">
    <div class="seg" id="planSeg" style="margin-bottom:16px;">
      <button data-ps="pay" class="on">Regular</button><button data-ps="budgets">Budgets</button><button data-ps="oneoff">One-offs</button><button data-ps="forecast">Forecast</button>
    </div>
    <div id="planBody"></div>
  </section>
  <section id="v-me" class="hidden"></section>
</main>

<nav class="bottom"><div class="inner">
  <button data-go="home" class="active"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home<span class="dot hidden" id="homeDot"></span></button>
  <button data-go="log"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Log</button>
  <button data-go="feed"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Transactions</button>
  <button data-go="plan"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Plan</button>
  <button data-go="me"><svg viewBox="0 0 24 24"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Month-end</button>
</div></nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, addDoc, doc, setDoc, updateDoc, deleteDoc, getDoc, onSnapshot, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const app = initializeApp({
  apiKey:"AIzaSyCZwz3F3dZUM_BeQ0GYRQjRijkkNp-2adk", authDomain:"household-budget-e2592.firebaseapp.com", projectId:"household-budget-e2592",
  storageBucket:"household-budget-e2592.firebasestorage.app", messagingSenderId:"487636413466", appId:"1:487636413466:web:8c8072120bf283d66bf5a3"
});
const auth=getAuth(app);
let db;try{db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});}catch(e){db=getFirestore(app);} // offline: saves are held on the phone and sync when back online

/* ================= constants ================= */
const CATEGORIES=["Food & Household","Clothes","Furnishings & Furniture","Going Out","Travel & Parking","Charity","TakeOut","Petrol","Board Games","Other"];
const ACCOUNTS=["Hersh Debit","Hersh Credit","Sonali Debit","Sonali Credit","Joint","Cash"];
const BANK=ACCOUNTS.filter(a=>a!=="Cash");
const CARDS=["Hersh Credit","Sonali Credit"];
const PAID_BY=["Hersh","Sonali"];
const POTS=[{key:"dayToDay",label:"Day-to-day",cycle:"monthly"},{key:"riyaan",label:"Riyaan",cycle:"monthly"},{key:"exceptionals",label:"Exceptionals",cycle:"annual"},{key:"holidays",label:"Holidays",cycle:"annual"},{key:"householdInvestment",label:"Household Investment",cycle:"open"}];
const UNITS=[{key:"joint",label:"Joint",accounts:["Joint"]},{key:"hersh",label:"Hersh",accounts:["Hersh Debit","Hersh Credit"]},{key:"sonali",label:"Sonali",accounts:["Sonali Debit","Sonali Credit"]}];
const DESTS=["Mortgage","Hersh S&S ISA","Sonali S&S ISA","Hersh Cash ISA","Sonali Cash ISA","Pension"];
// "Pension" is Hersh's personal pension (Vanguard); workplace pensions are paid through payroll, never by transfer
const accLabel=k=>k==="Pension"?"Hersh personal pension":k;
const ISAS=["Hersh S&S ISA","Sonali S&S ISA","Hersh Cash ISA","Sonali Cash ISA"];
const PENSIONS=["Hersh Scottish Widows","Hersh LifeSight","Hersh Vanguard personal","Hersh CIP workplace","Sonali Scottish Widows","Sonali Imagination workplace"];
const S={floor:10000,personTarget:5000,aniTarget:99000,mortgageRate:0.0384,sacStart:"2026-12",sacPct:0.03,horizon:"2030-07",
  // growth assumptions (planning assumptions, editable here)
  rates:{ss:0.05,pension:0.05,cashAfter:0.035,cash:{"Hersh Cash ISA":[0.0455,"2027-06"],"Sonali Cash ISA":[0.0442,"2027-07"]}},
  // workplace pensions: gross monthly = salary/12 x (employer + employee sacrifice)
  workplace:[{pot:"Hersh CIP workplace",salary:115000,er:0.06,ee:0.03,eeFrom:"2026-12",from:"2026-10"},{pot:"Sonali Imagination workplace",salary:86000,er:0.05,ee:0.05,eeFrom:"2027-01",from:"2027-01",note:"Employer share assumed 5% until the offer letter"}],
  rebalanceMonths:[1,4,7,10]};
const SEED_VERSION=4;

/* ================= helpers ================= */
const $=id=>document.getElementById(id), $$=s=>document.querySelectorAll(s);
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO=()=>isoOf(new Date());
const mkOf=iso=>iso.slice(0,7), curMK=()=>todayISO().slice(0,7);
const addMonths=(mk,n)=>{let[y,m]=mk.split("-").map(Number);m+=n;while(m>12){m-=12;y++;}while(m<1){m+=12;y--;}return`${y}-${pad(m)}`;};
const addDays=(iso,n)=>{const[y,m,d]=iso.split("-").map(Number);return isoOf(new Date(y,m-1,d+n));};
const daysBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
const fyStart=mk=>{const[y,m]=mk.split("-").map(Number);return`${m>=4?y:y-1}-04`;};
const fyLabel=k=>{const y=+k.slice(0,4);return`${y}/${String(y+1).slice(2)}`;};
const taxYearOf=mk=>fyStart(mk);
const monthLabel=mk=>{const[y,m]=mk.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"});};
const shortMonth=mk=>{const[y,m]=mk.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("en-GB",{month:"short",year:"numeric"});};
const mon=m=>new Date(2026,m-1,1).toLocaleDateString("en-GB",{month:"short"});
const dateLong=iso=>{const[y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"});};

function planDue(p,mk){

  if(p.start&&mk<p.start)return false;
  if(p.end&&mk>p.end)return false;
  if(p.freq==="monthly")return true;
  if(p.freq==="oneoff")return mk===p.start;
  return(p.months||[]).includes(+mk.slice(5));
}

const isWorkingDay=iso=>{const[y,m,d]=iso.split("-").map(Number);return![0,6].includes(new Date(y,m-1,d).getDay())&&!BANK_HOLIDAYS.has(iso);};
function occDate(p,mk){ // the day the bank actually moves the money
  const[y,m]=mk.split("-").map(Number), last=new Date(y,m,0).getDate();
  if(p.day==="lwd"){let d=last;while(!isWorkingDay(`${mk}-${pad(d)}`))d--;return`${mk}-${pad(d)}`;} // pay: last working day
  let iso=`${mk}-${pad(Math.min(Number(p.day)||15,last))}`;
  while(!isWorkingDay(iso))iso=addDays(iso,1); // debits and standing orders due on a weekend or bank holiday go the next working day
  return iso;
}
function occurrences(fromExcl,toIncl){
  const out=[];let mk=addMonths(mkOf(fromExcl),-1);const end=mkOf(toIncl);
  while(mk<=end){PLAN.forEach(p=>{if(planDue(p,mk)){const d=occDate(p,mk);if(d>fromExcl&&d<=toIncl)out.push({p,mk,date:d,key:`${p.id}@${mk}`});}});mk=addMonths(mk,1);}
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function occEffect(o,amt,acc){
  const p=o.p;let e=0;
  if(p.kind==="in"){if(p.account===acc)e+=amt;}
  else{if(p.account===acc)e-=amt;if(p.kind==="transfer"&&p.to===acc)e+=amt;}
  return e;
}

function schedText(p){

  if(p.day==="lwd")s+=", last working day";else if(p.day)s+=` on the ${ordinal(+p.day)}`;
  if(p.freq!=="oneoff"){if(p.start&&p.start>curMK())s+=`, from ${shortMonth(p.start)}`;if(p.end)s+=`, to ${shortMonth(p.end)}`;}

function monthBudget(pot,mk){const b=BUDGETS[mk];if(b&&b[pot]!=null&&(mk<=curMK()))return Number(b[pot]);return ruleFor(pot,mk);}
function bonusesFor(fy){return TX.filter(t=>t.type==="income"&&t.bonus&&fyStart(t.monthKey)===fy).reduce((s,t)=>s+t.value,0);}
function annualBudget(pot,fy){const a=ANNUAL[fy];const base=a&&a[pot]!=null?Number(a[pot]):ruleFor(pot,fy);return base+(pot==="exceptionals"?bonusesFor(fy):0);}

  if(lc)return{pending:lc.pending||{},date:lc.runDate,balances:lc.balances||{},mortgage:lc.mortgage?.close,isas:lc.isas||{},pensions:lc.pensions||OPENING?.pensions||{},pensionsAt:lc.pensionsAt||OPENING?.pensionsAt};
  const o=OPENING||SEED_OPENING;return{pending:o.pending||{},date:o.asAt,balances:o.balances,mortgage:o.mortgage,isas:o.isas,pensions:o.pensions||{},pensionsAt:o.pensionsAt};
}
function currentMEId(){ // the month being closed: the first month after the last close (or the opening month)
  const lc=lastClose(); const base=lc?addMonths(lc.id,1):mkOf((OPENING||SEED_OPENING).asAt);
  const open=Object.values(ME).filter(m=>m.status!=="closed").map(m=>m.id).sort()[0];
  return open&&open<=base?open:base;
}
function float(bal){return["Hersh Debit","Hersh Credit","Sonali Debit","Sonali Credit"].reduce((s,a)=>s+(Number(bal[a])||0),0);}
function computeME(mid){
  const m=ME[mid]||{}, op=openingFor(mid), runDate=m.runDate||(todayISO()>lastDay(mid)?lastDay(mid):todayISO());
  const occ=occurrences(op.date,runDate);
  // payments marked "not gone yet" at the previous month-end are expected in this one
  const prev=lastClose(mid);if(prev)Object.entries(prev.items||{}).forEach(([k,it])=>{if(it&&it.status==="notyet"&&!occ.some(o=>o.key===k)){const[id,omk]=k.split("@");const p=PLAN.find(x=>x.id===id);if(p)occ.push({p,mk:omk,date:prev.runDate,key:k,carried:true});}});
  const items=m.items||{};
  const amtOf=o=>{const it=items[o.key];if(!it)return Number(o.p.amount);if(it.status==="missing"||it.status==="notyet")return 0;return it.amount!=null?Number(it.amount):Number(o.p.amount);};
  const resolved=o=>{const it=items[o.key];if(!it)return false;if(o.p.basis==="estimate"&&it.status!=="missing"&&it.status!=="notyet")return it.amount!=null;return true;};
  const txs=TX.filter(t=>!t.preOpening&&t.date>op.date&&t.date<=runDate);
  const units=UNITS.map(u=>{
    const opening=u.accounts.reduce((s,a)=>s+(Number(op.balances[a])||0),0);
    const tx=u.accounts.reduce((s,a)=>s+txs.reduce((x,t)=>x+txEffect(t,a),0),0);
    const plan=u.accounts.reduce((s,a)=>s+occ.reduce((x,o)=>x+occEffect(o,amtOf(o),a),0),0);
    const pend=u.accounts.reduce((s,a)=>s+pendingOf(op.pending,a),0);
    const expected=r2(opening+tx+plan+pend);
    const entered=u.accounts.every(a=>m.balances&&m.balances[a]!==undefined&&m.balances[a]!==null&&m.balances[a]!=="");
    const actual=entered?r2(u.accounts.reduce((s,a)=>s+Number(m.balances[a]),0)):null;
    return{...u,opening:r2(opening),tx:r2(tx),plan:r2(plan),pend:r2(pend),expected,actual,gap:entered?r2(actual-expected):null,txCount:u.accounts.reduce((s,a)=>s+txs.filter(t=>txEffect(t,a)!==0).length,0)};
  });
  const mPay=occ.filter(o=>o.p.role==="mortgage").reduce((s,o)=>s+amtOf(o),0), mOver=occ.filter(o=>o.p.to==="Mortgage").reduce((s,o)=>s+amtOf(o),0)+txs.filter(t=>t.toAccount==="Mortgage").reduce((s,t)=>s+t.value,0);
  const mOpen=Number(op.mortgage)||0;
  const mClose=m.mortgage?.close!=null&&m.mortgage.close!==""?Number(m.mortgage.close):null;
  const mortgage={open:mOpen,pay:r2(mPay),over:r2(mOver),close:mClose,change:mClose!=null?r2(mClose-mOpen):null,interest:mClose!=null?r2(mClose-mOpen+mPay+mOver):null};
  const isas=ISAS.map(k=>{const contrib=occ.filter(o=>o.p.to===k).reduce((s,o)=>s+amtOf(o),0)+txs.filter(t=>t.toAccount===k).reduce((s,t)=>s+t.value,0)-txs.filter(t=>t.account===k).reduce((s,t)=>s+t.value,0);const open=Number(op.isas?.[k])||0;const close=m.isas&&m.isas[k]!=null&&m.isas[k]!==""?Number(m.isas[k]):null;return{k,open,contrib:r2(contrib),close,growth:close!=null?r2(close-open-contrib):null};});
  const pensionDue=!op.pensionsAt||daysBetween(op.pensionsAt,runDate)>=182;
  const unresolved=occ.filter(o=>!resolved(o));
  const bal=m.balances||{};
  const flags=[];
  units.forEach(u=>{if(u.gap!=null&&u.gap!==0)flags.push({bad:true,t:`${u.label}: gap of ${money(u.gap,true)}. Log the missing item.`});if(u.actual==null)flags.push({bad:true,t:`${u.label}: enter the balance${u.accounts.length>1?"s":""}.`});});
  if(unresolved.length)flags.push({bad:true,t:`${unresolved.length} regular payment${unresolved.length>1?"s":""} not ticked or missing an actual.`});
  if(mortgage.close==null)flags.push({t:"Mortgage balance not entered (optional)."});
  const fl=units.every(u=>u.actual!=null)?float(bal):null;
  if(fl!=null&&fl<S.floor)flags.push({t:`Float ${money0(fl)} is below the £10,000 floor.`});
  occ.filter(o=>o.p.basis==="estimate"&&items[o.key]?.amount!=null).forEach(o=>{const a=Number(items[o.key].amount),e=Number(o.p.amount);if(e>0&&Math.abs(a-e)/e>0.15)flags.push({t:`${o.p.name}: actual ${money(a)} vs estimate ${money(e)}.`});});
  occ.filter(o=>items[o.key]?.status==="notyet").forEach(o=>flags.push({t:`${o.p.name} hasn't gone yet; it moves to next month's month-end.`}));
  occ.filter(o=>items[o.key]?.status==="override").forEach(o=>flags.push({t:`${o.p.name}: overridden to ${money(items[o.key].amount)}.`}));
  const rail=occ.find(o=>o.p.id.startsWith("p-h-rail")||o.p.name==="Rail");
  if(rail&&items[rail.key]?.amount>327)flags.push({t:`Rail ${money(items[rail.key].amount)} is above £327.`});
  if(pensionDue&&!m.pensionsUpdated)flags.push({t:"Pension balances are due (every 6 months)."});
  return{m,op,runDate,occ,items,amtOf,resolved,txs,units,mortgage,isas,pensionDue,unresolved,flags,float:fl,blockers:flags.filter(f=>f.bad).length};
}

      const monthsLeft=(+fy.slice(0,4)+1)*12+3-(+mk.slice(0,4)*12+ +mk.slice(5))+1,left=Math.max(0,annualBudget(k,fy)-fySpent[key]),use=left/monthsLeft;fySpent[key]+=use;hersh-=use*shares[k].hersh;sonali-=use*shares[k].sonali;});

function pensionPaid(who,ty){
  // tax year runs 6 April to 5 April; relief at source: cash paid is 80% of the gross contribution
  const a=ty+"-06",b=(+ty.slice(0,4)+1)+"-04-05",mine=acc=>who.key==="hersh";
  const fromTx=TX.filter(t=>t.type==="transfer"&&t.toAccount==="Pension"&&mine(t.account)&&t.date>=a&&t.date<=b).reduce((s,t)=>s+t.value,0);
  let fromPlan=0;Object.values(ME).forEach(m=>Object.entries(m.items||{}).forEach(([k,it])=>{const[id,mk]=k.split("@");const p=PLAN.find(x=>x.id===id);if(!p||p.to!=="Pension"||!mine(p.account)||it.status==="missing")return;const d=occDate(p,mk);if(d<a||d>b)return;fromPlan+=it.amount!=null?Number(it.amount):Number(p.amount);}));
  const cash=r2(fromTx+fromPlan);return{cash,gross:r2(cash/0.8)};
}
function aniCalc(mid,ps,who){
  const ytd=Number(ps.ytd)||0,per=Number(ps.period)||0,ty=taxYearOf(mid),endMk=(+ty.slice(0,4)+1)+"-03";let rest=0,mk=mid;
  while((mk=addMonths(mk,1))<=endMk)rest+=per*(who.sac&&mk>=S.sacStart&&mid<S.sacStart?(1-S.sacPct):1);

}
function nextMoves(mid){
  const a=addMonths(mid,1),b=addMonths(mid,2),out=[];
  const prevOf=p=>PLAN.find(x=>x.id!==p.id&&(x.series||x.id)===(p.series||p.id)&&x.end===addMonths(p.start,-1));
  const nextOf=p=>PLAN.find(x=>x.id!==p.id&&(x.series||x.id)===(p.series||p.id)&&x.start===addMonths(p.end,1));
  PLAN.forEach(p=>{

      const prev=prevOf(p);

}

  const mid=currentMEId(), c=computeME(mid), m=c.m;
  const ok=t=>`<span class="chip ok">${t||"Done"}</span>`, todo=t=>`<span class="chip warn">${t}</span>`, info=t=>`<span class="chip grey">${t}</span>`;
  // step 1: regular payments, folded per account
  const occRow=o=>{const it=c.items[o.key],est=o.p.basis==="estimate",st=it?.status,amtShown=it?.amount!=null?it.amount:o.p.amount;
    const ctrl=est?`<div class="inline-in"><input type="number" step="0.01" inputmode="decimal" placeholder="Actual" data-meest="${o.key}" value="${it?.amount??""}"><button class="btn ghost sm${st==="notyet"?" on":""}" data-menotyet="${o.key}">Not gone yet</button><button class="btn ghost sm${st==="missing"?" on":""}" data-memiss="${o.key}">Missing</button></div>`
      :`<div class="row-btns" style="margin-top:0;"><button class="btn sm${st==="ticked"?" on":""}" data-metick="${o.key}">${st==="ticked"?"Ticked":"Tick"}</button><button class="btn ghost sm${st==="override"?" on":""}" data-meovr="${o.key}">Override</button><button class="btn ghost sm${st==="notyet"?" on":""}" data-menotyet="${o.key}">Not gone yet</button><button class="btn ghost sm${st==="missing"?" on":""}" data-memiss="${o.key}">Missing</button></div>`;
    return`<div class="li" style="display:block;"><div style="display:flex;justify-content:space-between;gap:10px;"><div style="min-width:0;"><div class="t">${esc(o.p.name)}</div><div class="d">${dateShort(o.date)}${o.p.kind==="transfer"?" · to "+esc(accLabel(o.p.to)):""}${est?` · estimate ${money(o.p.amount)}`:""}</div></div><div class="r num" style="font-weight:600;${o.p.kind==="in"?"color:var(--teal-dark)":""}">${st==="missing"||st==="notyet"?"£0.00":(o.p.kind==="in"?"+":"")+money(amtShown)}</div></div>${o.carried?`<div class="d"><span class="chip warn">Carried from last month</span></div>`:st==="notyet"?`<div class="d">Moves to next month's month-end</div>`:""}
      <div style="margin-top:8px;">${ctrl}</div>
      ${meOverride===o.key?`<form class="sheet form-grid" data-meovrform="${o.key}"><label class="f">Actual amount (£)<input type="number" step="0.01" name="amt" value="${it?.amount??o.p.amount}" required></label><label class="f">Applies to<select name="scope"><option value="month">Just this month</option><option value="forward">This month and going forward</option></select></label><div class="full actions-row" style="margin-top:0;"><button type="button" class="btn ghost sm" data-meovrcancel>Cancel</button><button class="btn sm">Save</button></div></form>`:""}</div>`;};
  let firstAcc=null;const accFolds=ACCOUNTS.map(a=>{const l=c.occ.filter(o=>o.p.account===a);if(!l.length)return"";const left=l.filter(o=>!c.resolved(o)).length;
    const first=!firstAcc&&left>0;if(first)firstAcc=a;
    return fold(`me-${mid}-acc-${a}`,esc(a),`${l.length} item${l.length>1?"s":""}`,left?todo(left+" to do"):ok(),first,l.map(occRow).join(""),true);}).join("");
  const s1Left=c.unresolved.length;
  const psDoneOf=w=>{const ps=m[w.field]||{};return !c.occ.find(o=>o.p.role===w.role)||(ps.ytd!=null&&ps.period!=null&&ps.net!=null);};
  const firstStep=s1Left?1:!PEOPLE.every(psDoneOf)?2:c.units.some(u=>u.gap!==0)?3:6;
  const step1=fold(`me-${mid}-s1`,"1. Regular payments and income","Tick, override, or enter the actual for estimates",s1Left?todo(s1Left+" to do"):ok(),firstStep===1,
    (accFolds||`<div class="empty">Nothing due in this period.</div>`)+`<div class="actions-row"><button class="btn ghost sm" id="meTickAll">Tick all remaining fixed</button><button class="btn ghost sm" data-go="plan">Add a regular payment</button></div>`);
  // step 2: payslips
  const payslip=who=>{const ps=m[who.field]||{},ani=aniCalc(mid,ps,who),ty=taxYearOf(mid),payOcc=c.occ.find(o=>o.p.role===who.role);
    const done=ps.ytd!=null&&ps.period!=null&&ps.net!=null;
    const res=ps.ytd&&ps.period?`<div class="calc"><span>Taxable pay to date</span><span class="num">${money(ps.ytd)}</span><span>Rest of ${fyLabel(ty)}${who.sac?` (salary sacrifice from ${shortMonth(S.sacStart)})`:""}</span><span class="num">${money(ani.rest)}</span><span>Less personal pension paid so far (${money(pensionPaid(who,ty).cash)} cash)</span><span class="num">${money(-ani.paid)}</span><span class="tot">Projected adjusted net income</span><span class="num tot">${money(ani.proj)}</span></div>
      ${ani.gross>0?`<div class="gap bad"><span>Over £99,000 by</span><span class="num">${money(ani.gross)}</span></div><div class="calc"><span>Still to pay into the personal pension (cash)</span><span class="num tot">${money(ani.cash)}</span><span>Gross, for Self Assessment</span><span class="num">${money(ani.gross)}</span><span>Must land before</span><span class="num">5 April ${+ty.slice(0,4)+1}</span></div>${who.key==="hersh"?`<div class="actions-row"><button class="btn sm" id="meSetTopUp" data-cash="${ani.cash}">Set the March top-up to ${money(ani.cash)}</button></div>`:""}`
      :`<div class="gap ok"><span>Under £99,000, headroom</span><span class="num">${money(S.aniTarget-ani.proj)}</span></div>`}`:"";
    const status=!done?(payOcc?todo("To enter"):info("Not due")):ani.gross>0?todo("Over £99k"):ok("On target");
    return fold(`me-${mid}-ps-${who.key}`,`${who.label}`,payOcc?`${shortMonth(mid)} payslip; net pay fills the pay line`:`No pay due this period`,status,!done&&!!payOcc&&who===PEOPLE.find(w=>!psDoneOf(w)),
      `<div class="form-grid">${[["ytd","Taxable pay to date"],["period","Taxable pay this period"],["net","Net pay this period"]].map(([k,l])=>`<label class="f">${l}<input type="number" step="0.01" inputmode="decimal" data-meps="${k}" data-who="${who.key}" value="${ps[k]??""}"></label>`).join("")}</div>${res}`,true);};
  const psDone=PEOPLE.every(w=>{const ps=m[w.field]||{};return !c.occ.find(o=>o.p.role===w.role)||(ps.ytd!=null&&ps.period!=null&&ps.net!=null);});
  const step2=fold(`me-${mid}-s2`,"2. Payslips","Pay and the £99,000 adjusted net income test",psDone?ok():todo("To enter"),firstStep===2,PEOPLE.map(payslip).join(""));
  // step 3: current accounts
  const unit=u=>{const st=u.gap==null?todo("Enter balance"):u.gap===0?ok("£0.00"):todo(money(u.gap,true));
    return fold(`me-${mid}-u-${u.key}`,u.label,`Expected ${money(u.expected)}`,st,u===c.units.find(x=>x.gap!==0),
    `<div class="form-grid">${u.accounts.map(a=>`<label class="f">${esc(a)}${CARDS.includes(a)?" (owed)":""}<input type="number" step="0.01" inputmode="decimal" data-mebal="${a}" value="${m.balances&&m.balances[a]!=null?(CARDS.includes(a)?-m.balances[a]:m.balances[a]):""}"></label>`).join("")}</div>
    ${c.runDate<todayISO()?`<div class="note small" style="margin-top:6px;">Only have today's balance? Enter it in the box for today and the app works back to ${dateShort(c.runDate)} using what's logged since.</div><div class="form-grid" style="margin-top:6px;">${u.accounts.map(a=>`<label class="f">${esc(a)} today${CARDS.includes(a)?" (owed)":""}<input type="number" step="0.01" inputmode="decimal" data-metoday="${a}" placeholder="Today"></label>`).join("")}</div>`:""}
    <div class="calc"><span>Opening (${dateShort(c.op.date)})</span><span class="num">${money(u.opening)}</span><span>Regular payments and income</span><span class="num">${money(u.plan,true)}</span>${u.pend?`<span>Pending at the start, now cleared</span><span class="num">${money(u.pend,true)}</span>`:""}<span>Logged transactions (${u.txCount})</span><span class="num">${money(u.tx,true)}</span><span class="tot">Expected</span><span class="num tot">${money(u.expected)}</span>${u.actual!=null?`<span>Actual</span><span class="num">${money(u.actual)}</span>`:""}</div>
    ${u.gap==null?"":u.gap===0?`<div class="gap ok"><span>Ties out</span><span class="num">£0.00</span></div>`:`<div class="gap bad"><span>Gap: log what's missing</span><span class="num">${money(u.gap,true)}</span></div>`}
    <div class="actions-row"><button class="btn ghost sm" data-feedunit="${u.key}">See logged transactions</button></div>`,true);};
  const uLeft=c.units.filter(u=>u.gap!==0).length;
  const step3=fold(`me-${mid}-s3`,"3. Current accounts","Balances as the bank app shows them; each must be £0.00 out",uLeft?todo(uLeft+" to tie out"):ok(),firstStep===3,c.units.map(unit).join(""));
  // step 4: mortgage, ISAs, pensions (record only)
  const step4=fold(`me-${mid}-s4`,`4. Mortgage, ISAs${c.pensionDue?" and pensions":""}`,"Record balances; growth and interest are worked out",
    (c.mortgage.close!=null&&c.isas.every(i=>i.close!=null))?ok():info("Optional"),false,
    `<div class="li"><div style="min-width:0;flex:1;"><div class="t">Mortgage (Nationwide)</div><div class="d">Opening ${money(c.mortgage.open)}${c.mortgage.close!=null?` · down ${money(-c.mortgage.change)} · interest implied ${money(c.mortgage.interest)}`:""}</div></div><div class="r"><input type="number" step="0.01" data-memort="close" value="${m.mortgage?.close??""}" placeholder="Balance" style="width:130px;"></div></div>
    ${c.isas.map(i=>`<div class="li"><div style="min-width:0;flex:1;"><div class="t">${i.k}</div><div class="d">Opening ${money(i.open)} · in ${money(i.contrib,true)}${i.growth!=null?` · growth <b style="color:${i.growth<0?"var(--carmine-dark)":"var(--teal-dark)"}">${money(i.growth,true)}</b>`:""}</div></div><div class="r"><input type="number" step="0.01" data-meisa="${i.k}" value="${m.isas&&m.isas[i.k]!=null?m.isas[i.k]:""}" placeholder="Balance" style="width:130px;"></div></div>`).join("")}
    ${c.pensionDue?PENSIONS.map(k=>`<div class="li"><div><div class="t">${k}</div><div class="d">Last ${c.op.pensions?.[k]!=null?money(c.op.pensions[k]):"not set"}</div></div><div class="r"><input type="number" step="0.01" data-mepen="${k}" value="${m.pensions&&m.pensions[k]!=null?m.pensions[k]:""}" placeholder="Balance" style="width:130px;"></div></div>`).join(""):""}`);
  // step 5: budgets
  const tx=TX.filter(t=>t.monthKey===mid),fy=fyStart(mid),fyTx=TX.filter(t=>fyStart(t.monthKey)===fy&&t.monthKey<=mid);
  const over=[["dayToDay",potSpend(tx,"dayToDay"),monthBudget("dayToDay",mid)],["riyaan",potSpend(tx,"riyaan"),monthBudget("riyaan",mid)]].filter(x=>x[1]>x[2]).length;
  const step5=fold(`me-${mid}-s5`,"5. Budgets",`${monthLabel(mid)} and ${fyLabel(fy)} to date`,over?todo(over+" over"):ok("Within"),false,
    `<div class="grid-2">${potCard("Day-to-day",potSpend(tx,"dayToDay"),monthBudget("dayToDay",mid))}${potCard("Riyaan",potSpend(tx,"riyaan"),monthBudget("riyaan",mid))}${potCard("Exceptionals",potSpend(fyTx,"exceptionals"),annualBudget("exceptionals",fy),"year to date")}${potCard("Holidays",potSpend(fyTx,"holidays"),annualBudget("holidays",fy),"year to date")}</div><div class="calc"><span>Household Investment this month (no limit, from Joint)</span><span class="num tot">${money(potSpend(tx,"householdInvestment"))}</span></div>`);
  // step 6: next month's moves
  const moves=nextMoves(mid), existing=ACTIONS.filter(a=>a.status==="todo"&&a.dueDate<=addMonths(mid,1)+"-31"&&!a.id.startsWith("nm-"));
  const recs=recommendations(mid);
  const step6=fold(`me-${mid}-s6`,"6. Next month's moves","What to set up, pay or stop; becomes actions when you close",(moves.length||recs.length)?info((moves.length+recs.length)+" new"):ok("None"),firstStep===6&&(moves.length+recs.length)>0,
    (recs.length?`<div class="eyebrow" style="margin-top:4px;">Recommended from the forecast</div>`+recs.map((r,i)=>`<div class="li"><div style="min-width:0;"><div class="t">${esc(r.text)}</div><div class="d">${esc(r.why)}</div><div class="row-btns"><button class="btn sm" data-merec="${i}">Add to Plan for ${shortMonth(r.mk)}</button></div></div></div>`).join("")+`<div class="eyebrow" style="margin-top:12px;">From the plan</div>`:"")+(moves.length?moves.map(x=>`<div class="li"><div><div class="t">${esc(x.text)}</div><div class="d">By ${dateShort(x.dueDate)}</div></div>${x.amount?`<div class="r num">${money(x.amount)}</div>`:""}</div>`).join(""):`<div class="note">Nothing new to set up. Regular payments carry on as they are.</div>`)
    +(existing.length?fold(`me-${mid}-s6x`,"Already on your actions",`${existing.length}`,"",false,existing.map(a=>`<div class="li"><div><div class="t">${esc(a.text)}</div><div class="d">${dateShort(a.dueDate)}</div></div></div>`).join(""),true):""));
  // close
  const notes=c.flags.filter(f=>!f.bad);
  $("v-me").innerHTML=`
  <div class="card" style="margin-bottom:14px;"><div class="acc-h"><h2 style="font-size:24px;">${monthLabel(mid)}</h2>${c.blockers?todo(c.blockers+" to fix"):ok("Ready to close")}</div>
   <div class="note">From ${dateLong(c.op.date)} to the "balances as at" date below: the last day of the month unless you change it. Enter each balance as it stood at the end of that day; anything dated after it belongs to next month.</div>
   <label class="f" style="margin-top:10px;max-width:220px;">Balances as at<input type="date" id="meRun" value="${c.runDate}"></label>
   <div class="progress">${[s1Left===0,psDone,uLeft===0].map(x=>`<span class="${x?"done":"bad"}"></span>`).join("")}</div></div>
  ${step1}${step2}${step3}${step4}${step5}${step6}
  <div class="card"><div class="eyebrow">Close</div>
   ${c.flags.filter(f=>f.bad).map(f=>`<div class="li"><div class="t" style="font-weight:400;">${todo("Fix")} ${esc(f.t)}</div></div>`).join("")}
   ${notes.length?fold(`me-${mid}-notes`,"Notes",`${notes.length} for information`,"",false,notes.map(f=>`<div class="li"><div class="t" style="font-weight:400;">${esc(f.t)}</div></div>`).join(""),true):""}
   ${c.float!=null?`<div class="calc"><span>Float</span><span class="num tot">${money(c.float)}</span><span>Above the £10,000 floor</span><span class="num">${money(c.float-S.floor,true)}</span></div>`:""}
   <div class="actions-row">${lastClose()?`<button class="btn ghost" id="meReopen" data-mid="${lastClose().id}">Reopen ${monthLabel(lastClose().id)}</button>`:""}<button class="btn accent" id="meClose" ${c.blockers?"disabled":""}>Close ${monthLabel(mid)}</button></div></div>`;
  wireME(mid,c);
  $$("[data-merec]").forEach(b=>b.onclick=async()=>{try{await addRecToPlan(recs[+b.dataset.merec]);}catch(e){fail(e);}});
}
function wireME(mid,c){
  const m=c.m;
  const num=v=>v===""?null:parseFloat(v);
  $("meRun")?.addEventListener("change",e=>meSave(mid,{runDate:e.target.value}));
  // today's balance less movements logged or planned after the as-at date gives the as-at balance
  $$("[data-metoday]").forEach(i=>i.addEventListener("change",()=>{const a=i.dataset.metoday;let x=i.value===""?null:parseFloat(i.value);if(x==null)return;if(CARDS.includes(a))x=-Math.abs(x);
    const after=TX.filter(t=>t.date>c.runDate&&t.date<=todayISO()).reduce((s,t)=>s+txEffect(t,a),0)+occurrences(c.runDate,todayISO()).reduce((s,o)=>s+occEffect(o,Number(o.p.amount),a),0);
    meSave(mid,{runDate:c.runDate,balances:{[a]:r2(x-after)}});setStatus(`${a}: ${money(Math.abs(r2(x-after)))} at ${dateShort(c.runDate)}, worked back from today`);}));
  $$("[data-mebal]").forEach(i=>i.addEventListener("change",()=>{const a=i.dataset.mebal;let v=num(i.value);if(v!=null&&CARDS.includes(a))v=-Math.abs(v);meSave(mid,{runDate:c.runDate,balances:{[a]:v}});}));
  $$("[data-meps]").forEach(i=>i.addEventListener("change",()=>{const k=i.dataset.meps,who=PEOPLE.find(w=>w.key===i.dataset.who);const patch={runDate:c.runDate,[who.field]:{[k]:num(i.value)}};
    if(k==="net"){const o=c.occ.find(x=>x.p.role===who.role);if(o)patch.items={[o.key]:{status:"actual",amount:num(i.value)}};}
    meSave(mid,patch);}));
  $$("[data-memort]").forEach(i=>i.addEventListener("change",()=>meSave(mid,{runDate:c.runDate,mortgage:{[i.dataset.memort]:num(i.value)}})));
  $$("[data-meisa]").forEach(i=>i.addEventListener("change",()=>meSave(mid,{isas:{[i.dataset.meisa]:num(i.value)}})));
  $$("[data-mepen]").forEach(i=>i.addEventListener("change",()=>meSave(mid,{pensionsUpdated:true,pensions:{[i.dataset.mepen]:num(i.value)}})));
  $$("[data-meest]").forEach(i=>i.addEventListener("change",()=>meItem(mid,i.dataset.meest,{status:"actual",amount:num(i.value)})));
  $$("[data-metick]").forEach(b=>b.onclick=()=>meItem(mid,b.dataset.metick,{status:"ticked",amount:null}));
  $$("[data-meovr]").forEach(b=>b.onclick=()=>{meOverride=b.dataset.meovr;renderME();});
  $$("[data-meovrcancel]").forEach(b=>b.onclick=()=>{meOverride=null;renderME();});
  $$("[data-meovrform]").forEach(f=>f.onsubmit=async e=>{e.preventDefault();const key=f.dataset.meovrform,d=Object.fromEntries(new FormData(f).entries()),amt=parseFloat(d.amt)||0,o=c.occ.find(x=>x.key===key);
    await meItem(mid,key,{status:"override",amount:amt});
    if(d.scope==="forward"&&o)try{await changePlan(o.p,addMonths(o.mk,1),{amount:amt});}catch(err){fail(err);}
    meOverride=null;renderME();});
  $$("[data-menotyet]").forEach(b=>b.onclick=()=>meItem(mid,b.dataset.menotyet,{status:"notyet",amount:null}));
  $$("[data-memiss]").forEach(b=>b.onclick=async()=>{const key=b.dataset.memiss,o=c.occ.find(x=>x.key===key);await meItem(mid,key,{status:"missing",amount:0});
    if(o&&o.p.freq!=="oneoff"&&confirm(`${o.p.name} didn't arrive. Has it ended? OK ends it from ${shortMonth(o.mk)}; Cancel keeps it as a one-month miss.`)){try{await updateDoc(doc(db,"plan_items",o.p.id),{end:addMonths(o.mk,-1),updatedAt:serverTimestamp()});}catch(err){fail(err);}}});
  $("meTickAll")?.addEventListener("click",()=>{const items={};c.occ.forEach(o=>{if(!(m.items||{})[o.key]&&o.p.basis!=="estimate")items[o.key]={status:"ticked",amount:null};});meSave(mid,{runDate:c.runDate,items});});
  $$("[data-feedunit]").forEach(b=>b.onclick=()=>{const u=UNITS.find(x=>x.key===b.dataset.feedunit);FL.period="custom";FL.from=addDays(c.op.date,1);FL.to=c.runDate;FL.account=u.accounts.length===1?u.accounts[0]:"";$("flPeriod").value="custom";$("flFrom").value=FL.from;$("flToDate").value=FL.to;$("flAccount").value=FL.account;go("feed");});
  $("meSetTopUp")?.addEventListener("click",async e=>{const cash=+e.target.dataset.cash;const p=PLAN.find(x=>x.role==="pensionTopUp");try{if(p)await updateDoc(doc(db,"plan_items",p.id),{amount:cash,updatedAt:serverTimestamp()});const a=ACTIONS.find(x=>x.id==="a-pension");await setDoc(doc(db,"actions","a-pension"),{text:`Pay ${money(cash)} into the personal pension (gross ${money(cash/0.8)} for Self Assessment)`,dueDate:`${+taxYearOf(mid).slice(0,4)+1}-03-15`,owner:"Hersh",amount:cash,reason:"Keeps adjusted net income at or under £99,000; must land before 5 April",status:a?.status||"todo",source:"payslip"},{merge:true});setStatus("Pension top-up set to "+money(cash));}catch(err){fail(err);}});
  $("meClose")?.addEventListener("click",async()=>{
    const who=prompt("Closing the month. Who is closing? (Hersh or Sonali)","Hersh");if(!who)return;
    try{const b=writeBatch(db);
      nextMoves(mid).forEach(x=>{if(!ACTIONS.some(a=>a.id===x.id))b.set(doc(db,"actions",x.id),{text:x.text,dueDate:x.dueDate,owner:"Hersh",amount:x.amount||null,reason:"Next month's moves",status:"todo",source:"next-month",createdAt:serverTimestamp()});});
      const pensions=c.pensionDue&&m.pensionsUpdated?{...c.op.pensions,...m.pensions}:c.op.pensions;
      const isas={};c.isas.forEach(i=>isas[i.k]=i.close!=null?i.close:r2(i.open+i.contrib));
      b.set(doc(db,"month_ends",mid),{status:"closed",runDate:c.runDate,closedBy:who,closedAt:serverTimestamp(),mortgage:{close:c.mortgage.close??c.mortgage.open},isas,pensions,pensionsAt:c.pensionDue&&m.pensionsUpdated?c.runDate:c.op.pensionsAt,float:c.float==null?null:r2(c.float)},{merge:true});
      await b.commit();setStatus(`${monthLabel(mid)} closed`);go("home");}catch(err){fail(err);}
  });
  $("meReopen")?.addEventListener("click",async e=>{const id=e.target.dataset.mid;if(!confirm(`Reopen ${monthLabel(id)}? Later months stay as they are.`))return;try{await setDoc(doc(db,"month_ends",id),{status:"open"},{merge:true});}catch(err){fail(err);}});
}

go("home");
</script>
</body>
</html>
